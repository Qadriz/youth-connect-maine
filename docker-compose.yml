services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: youth-connect-maine:latest
    container_name: youth-connect-maine
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      NODE_ENV: production
      PORT: 3003
      HOSTNAME: 0.0.0.0
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3003',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Optional: live reload for development
  #   docker compose --profile dev up web-dev
  web-dev:
    profiles: ["dev"]
    image: node:20-alpine
    container_name: youth-connect-maine-dev
    working_dir: /app
    ports:
      - "3003:3003"
    environment:
      NODE_ENV: development
    volumes:
      - .:/app
      - youth_connect_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev"

volumes:
  youth_connect_node_modules:
